name: Automated API Tests
run-name: Run framework tests in Docker

# Triggers: execute on push or pull request events for main and master branches
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Clone the repository code onto the GitHub runner machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build the Docker image using the project's Dockerfile
      - name: Build Docker image
        run: docker build -t qa-sandbox-tests .

      # 3. Run the container and inject configuration and encrypted GitHub secrets
      - name: Run tests in Docker container
        env:
          BASE_URL: https://api.qasandbox.org
          GRAPHQL_URL: https://api.qasandbox.org/graphql
          USERNAME: ${{ secrets.QA_SANDBOX_USERNAME }}
          PASSWORD: ${{ secrets.QA_SANDBOX_PASSWORD }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -e BASE_URL="$BASE_URL" \
            -e GRAPHQL_URL="$GRAPHQL_URL" \
            -e USERNAME="$USERNAME" \
            -e PASSWORD="$PASSWORD" \
            qa-sandbox-tests

      # 4. Generate the Allure Report and manage the test run history
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # 5. Deploy the generated Allure Report directly to GitHub Pages for static hosting
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history